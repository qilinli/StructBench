# DeformingPlate — Transolver PROVISIONAL reference config (ADR-0041 ②, ADR-0044).
# No published vanilla-Transolver rollout number exists for this task; the
# recipe is declared, not reproduced. Budget matched to the MGN reference
# (batch 2, 10M steps) for a same-task/same-data/same-budget comparison.
# Not yet run.

[run]
benchmark = "deforming_plate"
seed = 1

[model]
family = "transolver"
adaptive_temperature = false
slice_reparam = false
input_frames = 2
dim = 3
hidden_dim = 128
n_layers = 8
n_heads = 8
slice_num = 64
mlp_ratio = 1
dropout = 0.0
node_type_size = 9
noise_std = 3.0    # WORKING-FRAME (mm) noise: paper 3e-3 m x length_scale 1000 (CORRECTIONS 2026-08-17 / ADR-0043 dated note; was 0.003 = 1000x too weak)
normalizer_warmup_steps = 1000
weight_decay = 1e-5      # AdamW, thuml reference (grounding §4.1)
max_grad_norm = 0.1      # global-norm clip, thuml reference

history_frames = 0            # reference Markovian feature builder (ADR-0049 off)
frames_per_call = 1            # ADR-0050/0051 prediction scheme: 1 = autoregressive next-step
impact_velocity_feature = false  # ADR-0051 B: scalar loading-param channel (off = byte-identical)
time_conditioned = false        # ADR-0054: faithful thuml time-conditioned scheme (off = byte-identical)

[train]
batch_size = 2
lr_init = 1e-3
lr_decay = 0.1           # UNUSED by the transolver family (cosine anneal,
                         # ADR-0044); present because [train] is family-uniform.
training_steps = 2_000_000      # 3-day budget @ measured throughput (CORRECTIONS 2026-08-17)
val_every = 50_000
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0
train_frames = 0
