# DeformingPlate MGN reference config (ADR-0043 §8; ADR-0041 v0.3).
# Recipe: the paper's native-MGN recipe (h=0 history; node features = one-hot
# node type + next-step world-space velocity on OBSTACLE nodes; mesh-edge
# features (u_ij, |u_ij|, x_ij, |x_ij|); world edges (x_ij, |x_ij|) within
# r_W; outputs = velocity (integrated once) + von Mises stress (direct);
# 15 message-passing steps, latent 128, two-hidden-layer MLPs; noise
# N(0, 3e-3) on NORMAL-node positions; Adam, batch 2, lr 1e-4, 10M steps).
# [model] values mirror the MGNConfig dataclass defaults, which already
# encode this recipe. world_edge_radius=30.0 is the working-frame (mm)
# value — CONFIRMED by the 2026-08-08 full-dataset measurement (ADR-0042 §2b
# note): the source is metre-native, so r_W = 0.03 m × 1e3 = 30.0 mm exactly. [train]'s
# non-recipe keys (lr_decay, val_every, aux_tail_weight, train_frames) mirror
# configs/taylor_impact_2d/cgn.toml's structure at MGN-neutral values (val_every
# scaled to this config's much larger step budget — see its own comment
# below): equal w_pos/w_aux weighting per ADR-0043 §9's declared single-L2,
# no per-component weights, and full (untruncated) training trajectories
# since horizon="full".
# Not yet run — this is the config the ADR-0043 §8 blessing gate trains
# against; any recipe deviation (e.g. shorter compute-bound training) is
# recorded in the training ledger with the gate unchanged.

[run]
benchmark = "deforming_plate"
seed = 1                        # torch RNG: init, noise, shuffle; avoid seed 0 for training runs (CORRECTIONS 2026-07-10)

[model]
family = "mgn"
input_frames = 2                # h=0 history (ADR-0043 §3); the StructBench floor and the deforming_plate card's protocol value
dim = 3
hidden_dim = 128
message_passing_steps = 15
nmlp_layers = 2
node_type_size = 9
world_edge_radius = 30.0        # working frame (mm); measured-SI confirmed (ADR-0042 §2b note): 0.03 m × 1e3
noise_std = 3.0    # WORKING-FRAME (mm) noise: paper 3e-3 m x length_scale 1000 (CORRECTIONS 2026-08-17 / ADR-0043 dated note; was 0.003 = 1000x too weak)
normalizer_warmup_steps = 1000

history_frames = 0            # reference Markovian feature builder (ADR-0049 off)
mesh_edge_max_stretch = 0.0   # stretch gate disabled — reference behaviour (ADR-0049)

[train]
batch_size = 2                  # ADR-0043 §8 reference recipe
lr_init = 1e-4                  # ADR-0043 §8 reference recipe
lr_decay = 0.1
# lr_decay_steps is derived from training_steps by config.py: round(steps * 40000/100000).
# Derived lr_decay_steps=4_000_000: schedule reaches ~1e-6 by 10M steps (depth
# reproduced; the paper's 5M knee is a declared deviation — see the training
# ledger at blessing time).
training_steps = 2_000_000      # 3-day budget @ measured throughput (CORRECTIONS 2026-08-17)     # ADR-0043 §8 reference recipe
# Validation is a full rollout over all 100 val trajectories (~398 steps
# each), not a cheap batch eval — at the 100k-step siblings' val_every=2000
# cadence this would interleave ~3x the training compute over the 10M-step
# budget. 50_000 gives 200 checkpoints across the run (still ample best-
# checkpoint resolution) at ~13% of interleaved training compute.
val_every = 50_000
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0   # extra loss weight on above-mean aux targets; 0 = plain MSE (ADR-0043 §9: single L2, equal weight)
train_frames = 0        # 0 = full trajectories; horizon="full" (ADR-0043 §6), no ADR-0039-style truncation recipe applies here
