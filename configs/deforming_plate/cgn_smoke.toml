# CPU smoke of the full DeformingPlate CGN train->checkpoint->eval path. NOT a baseline.
# Mirrors cgn.toml with a shrunk capacity cell and a relaxed connectivity_radius
# (60.0 vs the reference 30.0) so a tiny smoke slice still forms connected edges.

[run]
benchmark = "deforming_plate"
seed = 0

[model]
family = "cgn"
input_frames = 2
dim = 3
connectivity_radius = 60.0
hidden_dim = 16
message_passing_steps = 2
nmlp_layers = 2
particle_type_embedding_size = 9
noise_std = 3.0
max_neighbors = 32
aux_transform = "none"
aux_transform_scale = 0.01

[train]
batch_size = 2
lr_init = 1e-4
lr_decay = 0.1
training_steps = 50
val_every = 25
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0
train_frames = 0
