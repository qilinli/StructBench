# NOT a baseline — CPU smoke of the full DeformingPlate GeoFLARE
# train->checkpoint->eval path. Mirrors geoflare.toml with a shrunk capacity
# cell (n_hidden/n_layers/n_heads/slice_num/n_hidden_local) and a short step
# budget. radius_near/radius_far/neighbors_near/neighbors_far are RELAXED
# relative to the reference: the tiny synthetic smoke mesh has only a
# handful of nodes scattered arbitrarily in space, so the reference's tight
# standardized-space radii (tuned for a real, locally-dense mesh) would
# leave near/far ball queries with too few (or zero) neighbors; widening the
# radii and shrinking the neighbor caps keeps the ball query well-defined at
# this scale without touching the standardized-coordinate convention itself
# (ADR-0045 gap 8).

[run]
benchmark = "deforming_plate"
seed = 0

[model]
family = "geoflare"
input_frames = 2
dim = 3
n_hidden = 16
n_layers = 2
n_heads = 2
slice_num = 4
mlp_ratio = 4
dropout = 0.0
n_hidden_local = 4
radius_near = 0.5        # relaxed for tiny synthetic meshes (see header)
radius_far = 2.0
neighbors_near = 2
neighbors_far = 3
node_type_size = 9
noise_std = 0.003
normalizer_warmup_steps = 5
weight_decay = 1e-4
max_grad_norm = 0.0

velocity_history = false      # reference Markovian feature builder (ADR-0049 off)

[train]
batch_size = 2
lr_init = 1e-4
lr_decay = 0.1           # UNUSED by the geoflare family (cosine anneal, ADR-0045)
training_steps = 50
val_every = 25
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0
train_frames = 0
