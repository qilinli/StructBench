# DeformingPlate — Transolver TIME-CONDITIONED (native structural scheme),
# seed 2 (ADR-0053).
# DP is where time-conditioning is most clearly native: a quasi-static
# actuator-pull, not a ballistic impact. The faithful thuml structural
# (Plasticity) template: history-free, non-autoregressive. The model maps
# (rest geometry + node types + prescribed obstacle/handle state at t + query
# time t) -> absolute state at t; every scored frame is queried independently
# (no rollout, no velocity window). frames_per_call=1 and velocity_history=false
# are REQUIRED (mutually exclusive with time-conditioning).
#
# impact_velocity_feature is FALSE: DeformingPlate has no scalar loading
# parameter (spec.loading_scalar is None — the actuator schedule is
# per-case, not a single impact speed), so there is no "-iv" DP variant. The
# prescribed handle/obstacle state at t (the kinematic-BC input channel)
# already carries the actuator conditioning the quasi-static pull needs.
#
# BUDGET IS A PLACEHOLDER: training_steps set by the maintainer after a
# throughput measurement to fit the 3-day wall-clock cap (ADR-0053 scope);
# both DP baselines are budget-matched to the slower method's 3-day step count.

[run]
benchmark = "deforming_plate"
seed = 2

[model]
family = "transolver"
input_frames = 2
dim = 3
hidden_dim = 128
n_layers = 8
n_heads = 8
slice_num = 64
mlp_ratio = 1
dropout = 0.0
node_type_size = 9
noise_std = 0.0          # inert under time-conditioning (no rollout; ADR-0053)
normalizer_warmup_steps = 1000
weight_decay = 1e-5      # AdamW, thuml reference (grounding §4.1)
max_grad_norm = 0.1      # global-norm clip, thuml reference

velocity_history = false        # REQUIRED false for time-conditioning (ADR-0053)
frames_per_call = 1             # REQUIRED 1 for time-conditioning (ADR-0053)
impact_velocity_feature = false  # DP has no scalar loading param (see header)
time_conditioned = true          # ADR-0053: faithful thuml native structural scheme

[train]
batch_size = 2
lr_init = 1e-3
lr_decay = 0.1           # UNUSED by the transolver family (cosine anneal,
                         # ADR-0044); present because [train] is family-uniform.
training_steps = 200_000   # PLACEHOLDER — DP budget set by maintainer after
                           # throughput measurement, 3-day cap (ADR-0053)
val_every = 5_000
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0
train_frames = 0
