# wave_propagation_1d — Transolver AUTOREGRESSIVE control, seed 1 (E-B).
# The fluid-convention scheme (ADR-0044 adaptation, k=1 next-step + velocity
# history + injected noise) as the scheme-axis control for the wave
# time-conditioned pair: same architecture, same 50k budget, autoregressive
# rollout at eval. history_frames=5 appends the window's finite-difference
# velocities (the CGN parity choice; ADR-0049) and the training noise becomes
# the CGN random-walk over the window with the GNS adjusted-next target.
# noise_std=0.06 transfers the wave-validated CGN noise (blessed x1-s1 recipe:
# ~17% of the axial velocity std) — an untuned transfer, flagged as such: the
# taylor precedent (ADR-0049) also adopted the blessed CGN noise for the
# transolver AR arm. Not yet run.

[run]
benchmark = "wave_propagation_1d"
seed = 1

[model]
family = "transolver"
input_frames = 6                # wave card protocol (ADR-0035); see header
dim = 2
hidden_dim = 128                # ADR-0044 family reference
n_layers = 8
n_heads = 8
slice_num = 64
mlp_ratio = 1
dropout = 0.0
node_type_size = 2              # raw ids: 1 = bar SPH (max id + 1); no wall part
noise_std = 0.06                # blessed wave CGN value (see header)
normalizer_warmup_steps = 1000
weight_decay = 1e-5             # AdamW, thuml reference (ADR-0044)
max_grad_norm = 0.1             # global-norm clip, thuml reference

history_frames = 5              # +5 window velocities; CGN random-walk window noise +
                                # GNS adjusted-next target (ADR-0049)
frames_per_call = 1             # ADR-0050/0051 prediction scheme: 1 = autoregressive
impact_velocity_feature = false  # AR control sees the velocity window instead
time_conditioned = false        # ADR-0054 off: this IS the scheme-axis control
adaptive_temperature = false     # ADR-0057 (off = byte-identical)
slice_reparam = false            # ADR-0057 (off = byte-identical)

[train]
batch_size = 2                  # family reference (ADR-0044, matched to MGN)
lr_init = 1e-3                  # thuml reference start rate (ADR-0044)
lr_decay = 0.1                  # UNUSED by the transolver family (cosine anneal,
                                # ADR-0044); present because [train] is family-uniform.
training_steps = 50_000         # wave CGN-matched budget (blessed x1-s1 recipe)
val_every = 2000                # wave CGN cadence
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0
train_frames = 0
