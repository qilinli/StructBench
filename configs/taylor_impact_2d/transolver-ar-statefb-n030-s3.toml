# Taylor 2D — ADR-0061 stability fleet arm N030, seed 3:
# N-030: state-input noise 0.30 (scale-trend point).
# Pre-registered (AMENDED 17-run design) in
# scratch/2026-09-04-stability-fleet-prereg.md; NOT a leaderboard row.
# Base = transolver-ar-statefb verbatim; only the ADR-0061 knobs change.

[run]
benchmark = "taylor_impact_2d"
seed = 3

[model]
family = "transolver"
adaptive_temperature = false
slice_reparam = false
aux_input = true             # ADR-0060: consume the state block at the last input frame
aux_input_noise_std = 0.30    # ADR-0061 arm N030
aux_input_pushforward = false # ADR-0061 arm N030
flow_map = false              # ADR-0062 anchored flow map (off = reference)
flow_map_anchor_time = true   # ADR-0062 anchor-time feature (inert when flow_map = false)
flow_map_max_dt = 0           # ADR-0062 training dt cap (0 = no cap)
flow_map_eval_intervals = []  # ADR-0062 re-anchoring m sweep (flow-map only)
flow_map_canonical_interval = 0  # ADR-0062 (0 = first listed interval)
flow_map_pushforward = false  # ADR-0063 anchor-chain knob (off = reference)
flow_map_anchor_noise_pos = 0.0  # ADR-0063 common-mode anchor noise, mm (0 = off)
flow_map_anchor_noise_vel = 0.0  # ADR-0063 differential anchor noise, mm/frame (0 = off)
flow_map_pushforward_generations = 1  # ADR-0063 amendment: chain-depth curriculum (1 = plain chain)
flow_map_structured_heads = false  # ADR-0064 knob 1 (return-map decoder)
flow_map_consistency_hinge = 0.0  # ADR-0064 knob 2 (soft comparator; exclusive with knob 1)
input_frames = 6                # taylor card protocol (ADR-0035); see header
dim = 2
hidden_dim = 256                # 2x the ADR-0044 reference (tuning arm; see header)
n_layers = 8
n_heads = 8
slice_num = 128                 # 2x the ADR-0044 reference (tuning arm; see header)
mlp_ratio = 1
dropout = 0.0
node_type_size = 3              # raw ids: 1 = bar SPH, 2 = wall (ADR-0047; max id + 1)
noise_std = 0.02                # blessed CGN taylor value (ADR-0049 noise rescale)
normalizer_warmup_steps = 1000
weight_decay = 1e-5             # AdamW, thuml reference (ADR-0044)
max_grad_norm = 0.1             # global-norm clip, thuml reference

history_frames = 5            # +5 window velocities; CGN random-walk window noise +
                              # GNS adjusted-next target (de-noise velocity, not the
                              # accumulated position offset; ADR-0049)
frames_per_call = 1            # ADR-0050/0051 prediction scheme: 1 = autoregressive next-step
impact_velocity_feature = false  # ADR-0051 B: scalar loading-param channel (off = byte-identical)
time_conditioned = false        # ADR-0054: faithful thuml time-conditioned scheme (off = byte-identical)

[train]
batch_size = 2                  # family reference (ADR-0044, matched to MGN)
lr_init = 1e-3                  # thuml reference start rate (ADR-0044)
lr_decay = 0.1                  # UNUSED by the transolver family (cosine anneal,
                                # ADR-0044); present because [train] is family-uniform.
training_steps = 100_000        # CGN-matched budget (ADR-0047 §6), not DP's 10M
val_every = 2000                # CGN taylor cadence
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0
aux_fields = ["deviatoric_stress_2d", "effective_plastic_strain", "internal_energy", "density"]  # state-pair target block (ADR-0059)
train_frames = 0
