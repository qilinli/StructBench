# Taylor 2D — Transolver ADR-0049 arm N02: noise rescaled to the blessed CGN
# taylor value (0.02, ~7% of the 150 m/s per-step displacement; the ported DP
# value 0.003 is ~1%). Single-knob change against the ADR-0047 baseline —
# closes the "taylor-scale noise sweep" ledger item. Feature builder stays
# reference Markovian.
# Not yet run.

[run]
benchmark = "taylor_impact_2d"
seed = 1

[model]
family = "transolver"
input_frames = 6                # taylor card protocol (ADR-0035); see header
dim = 2
hidden_dim = 128                # ADR-0044 family reference
n_layers = 8
n_heads = 8
slice_num = 64
mlp_ratio = 1
dropout = 0.0
node_type_size = 3              # raw ids: 1 = bar SPH, 2 = wall (ADR-0047; max id + 1)
noise_std = 0.02                # blessed CGN taylor value (ADR-0049 noise rescale)
normalizer_warmup_steps = 1000
weight_decay = 1e-5             # AdamW, thuml reference (ADR-0044)
max_grad_norm = 0.1             # global-norm clip, thuml reference

velocity_history = false      # reference Markovian feature builder (ADR-0049 off)
phi_mode = "off"              # SRO physics-conditioned slicing: off|feature|persistent (ADR draft)
phi_neighbors = 16            # kNN count for the strain-rate proxy (phi); inert when phi_mode="off"
phi_clamp = 4.0               # symmetric clamp on standardized phi; inert when off
phi_lambda_init = 0.0         # per-block phi-gate init; 0.0 => step-0 == vanilla; inert when off
phi_smooth = false           # SRO Cause-1 fix: spatial kNN smoothing of phi; inert when phi_mode="off"
phi_robust = false           # SRO Cause-1 fix: median/IQR robust phi statistics; inert when off
phi_vel_smooth = false        # SRO Cause-1 fix: temporal window-velocity smoothing; inert when off

[train]
batch_size = 2                  # family reference (ADR-0044, matched to MGN)
lr_init = 1e-3                  # thuml reference start rate (ADR-0044)
lr_decay = 0.1                  # UNUSED by the transolver family (cosine anneal,
                                # ADR-0044); present because [train] is family-uniform.
training_steps = 100_000        # CGN-matched budget (ADR-0047 §6), not DP's 10M
val_every = 2000                # CGN taylor cadence
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0
train_frames = 0
