# Taylor 2D — GeoFLARE PROVISIONAL config (ADR-0047; family recipe ADR-0045).
# "GeoFLARE" = GeoTransolver with GALE_FA attention. Runs on the ADR-0047
# synthesized lattice mesh + wall nodes (kinematic type 2); no published
# number exists for this task — provisional, no numeric gate. Budget matched
# to the blessed CGN taylor recipe (100k steps, ADR-0047 §6). input_frames =
# 6 satisfies the taylor card (ADR-0035); the family reads only the window's
# last frame, so the extra frames affect windowing and rollout seeding only.
# Ball-query radii stay in per-example standardized coordinates (scale-free,
# ADR-0045 gap 8) — no taylor-scale adjustment needed.
# Not yet run.

[run]
benchmark = "taylor_impact_2d"
seed = 1

[model]
family = "geoflare"
input_frames = 6                # taylor card protocol (ADR-0035); see header
dim = 2
n_hidden = 256                  # ADR-0045 family reference
n_layers = 6
n_heads = 8
slice_num = 128
mlp_ratio = 4
dropout = 0.0
n_hidden_local = 32
radius_near = 0.05              # standardized-coordinate units (ADR-0045 gap 8)
radius_far = 0.25
neighbors_near = 8
neighbors_far = 32
node_type_size = 3              # raw ids: 1 = bar SPH, 2 = wall (ADR-0047; max id + 1)
noise_std = 0.003               # DP family-reference value; CGN taylor uses 0.02 —
                                # a taylor-scale noise sweep stays open (ledger).
normalizer_warmup_steps = 1000
weight_decay = 1e-4             # reference AdamW-arm value (ADR-0045)
max_grad_norm = 0.0             # OFF — reference example has no gradient clipping

history_frames = 0            # reference Markovian feature builder (ADR-0049 off)

[train]
batch_size = 2                  # family reference (ADR-0045, matched to MGN)
lr_init = 1e-4                  # reference crash-example start_lr (ADR-0045)
lr_decay = 0.1                  # UNUSED by the geoflare family (cosine anneal,
                                # ADR-0045); present because [train] is family-uniform.
training_steps = 100_000        # CGN-matched budget (ADR-0047 §6), not DP's 10M
val_every = 2000                # CGN taylor cadence
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0
train_frames = 0
