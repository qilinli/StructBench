# Taylor 2D CGN COMPLETE-STATE baseline (paper tier-2 control): the blessed CGN
# recipe verbatim with train.aux_fields flipped to the ADR-0059 state block, so
# the model predicts the full per-particle state (deviator + peeq + energy +
# density) instead of the direct von Mises channel — the CGN analogue of the
# Transolver TC-state paper baseline (claims-map 2026-09-14). Research runs for
# the paper, not leaderboard rows.

[run]
benchmark = "taylor_impact_2d"
seed = 2                        # torch RNG: init, noise, shuffle; seed 2 of the s1-s2 pair

[model]
family = "cgn"
input_frames = 6
connectivity_radius = 1.5  # 3x particle spacing (ADR-0028); 0.6 broke edges under rollout drift
hidden_dim = 128
message_passing_steps = 10
nmlp_layers = 2
particle_type_embedding_size = 9
noise_std = 0.02
dim = 2
max_neighbors = 32  # 32 nearest per hop; taylor's physical degree hits ~53 in the mushroom so this DOES truncate at 1 hop by design — long-range coverage comes from the 10 MP hops, not the 1-hop cap (measured 2026-07-07)
aux_transform = "none"          # aux target space: "none" (raw) or "asinh" (tail-compressed; see aux_transform_scale)
aux_transform_scale = 0.01      # asinh knee; unused under "none"

[train]
aux_fields = ["deviatoric_stress_2d", "effective_plastic_strain", "internal_energy", "density"]  # ADR-0059 complete-state target block — the ONLY delta from cgn.toml
batch_size = 8   # A100-80GB memory bound at this capacity (batch 16 OOMs)
lr_init = 1e-4  # reference rate (ADR-0028); the old 1e-3 default drove memorization
lr_decay = 0.1
# lr_decay_steps is derived from training_steps by config.py: round(steps * 40000/100000).
training_steps = 100000  # -> derived lr_decay_steps 40000 (2.5 periods; clean decade drops at 40k/80k, ends ~1.3x the 1e-6 floor)
val_every = 2000
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0   # extra loss weight on above-mean aux targets; 0 = plain MSE (reference)
train_frames = 0        # truncate training trajectories to first N frames (ADR-0039 recipe); 0 = full
