# NotchBeam2D-Impact CGN baseline (Li et al. 2023; ADR-0034) (ADR-0026 task; grouped per ADR-0032).
# Recipe = the blessed h250c run (runs/fleet-2026-07-24-h250c/h250c-s1,
# ADR-0033 entry): the ADR-0039 §4 truncated recipe (train_frames 250) with
# the ADR-0038 strain knobs (aux_tail_weight 3, asinh transform) on the
# 192/15/2 capacity cell at 250k steps. Extending the 200k h250 arm to 250k
# cut seed-mean test rollout position RMSE 21% and deflection MAE 30%
# (2026-07-24 fleet vs 2026-07-20 fleet).

[run]
benchmark = "notch_beam_2d_impact"
seed = 1                        # torch RNG: init, noise, shuffle (blessed seed; seed sets start at 1, CORRECTIONS 2026-07-10)

[model]
family = "cgn"
input_frames = 6
connectivity_radius = 7.5  # 3x the 2.5 mm particle spacing (2-3x convention); ~28 neighbours, under the 32 cap
hidden_dim = 192
message_passing_steps = 15
nmlp_layers = 2
particle_type_embedding_size = 9
noise_std = 0.01
dim = 2
max_neighbors = 32  # project-wide backstop cap (M-B, 2026-07-06): sized above the physical degree so truncation never occurs
aux_transform = "asinh"         # aux target space: "none" (raw) or "asinh" (tail-compressed; see aux_transform_scale)
aux_transform_scale = 0.01      # asinh knee ~= the 1% crack threshold (ADR-0038)

[train]
batch_size = 4
lr_init = 1e-4  # reference rate (ADR-0028); the old 1e-3 default drove memorization
lr_decay = 0.1
# lr_decay_steps is derived from training_steps by config.py (round(steps * 40000/100000)).
training_steps = 250000
val_every = 2000
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 3     # extra loss weight on above-mean aux targets (ADR-0038; 0 = plain MSE)
train_frames = 250      # truncate training trajectories to the scored window (ADR-0039 recipe); 0 = full
