# Notch-impact — Transolver PROVISIONAL config (ADR-0048; family recipe ADR-0044).
# Runs on the ADR-0048 beam-only synthesized lattice mesh (pin + supports
# unmeshed, kinematic AND scripted); no published number for this task —
# provisional, no numeric gate. Budget matched to the blessed CGN h250c recipe
# (250k steps, train_frames=250, ADR-0039); input_frames = 6 per the card.
# DECLARED DEVIATIONS from h250c: no aux_transform/aux_tail_weight (raw-space
# aux, plain MSE), family-native batch 2 / noise 0.003 — ledger.
# Not yet run.

[run]
benchmark = "notch_beam_2d_impact"
seed = 1

[model]
family = "transolver"
input_frames = 6                # notch card protocol (ADR-0035); see header
dim = 2
hidden_dim = 128                # ADR-0044 family reference
n_layers = 8
n_heads = 8
slice_num = 64
mlp_ratio = 1
dropout = 0.0
node_type_size = 4              # raw ids: 1 = beam, 2 = pin, 3 = supports (max id + 1)
noise_std = 0.003               # DP family-reference value; CGN notch (h250c) uses
                                # 0.01 — declared deviation, ledger.
normalizer_warmup_steps = 1000
weight_decay = 1e-5             # AdamW, thuml reference (ADR-0044)
max_grad_norm = 0.1             # global-norm clip, thuml reference

velocity_history = false      # reference Markovian feature builder (ADR-0049 off)
frames_per_call = 1            # ADR-0050/0051 prediction scheme: 1 = autoregressive next-step
impact_velocity_feature = false  # ADR-0051 B: scalar loading-param channel (off = byte-identical)
time_conditioned = false        # ADR-0054: faithful thuml time-conditioned scheme (off = byte-identical)

[train]
batch_size = 2                  # family reference (ADR-0044, matched to MGN)
lr_init = 1e-3                  # thuml reference start rate (ADR-0044)
lr_decay = 0.1                  # UNUSED by the transolver family (cosine anneal,
                                # ADR-0044); present because [train] is family-uniform.
training_steps = 250_000        # h250c-matched budget (ADR-0048), not DP's 10M
val_every = 2000                # h250c cadence
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0
train_frames = 250      # ADR-0039 §4 recipe: train only the scored window
