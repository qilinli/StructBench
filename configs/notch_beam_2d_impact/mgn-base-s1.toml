# Notch-impact — MGN PROVISIONAL config (ADR-0048; family recipe ADR-0043 §8).
# Runs on the ADR-0048 beam-only synthesized lattice mesh (notch stair-stepped;
# pin + supports unmeshed, kinematic AND scripted — world-edge contact); no
# published MGN number exists for this task — provisional, no numeric gate.
# Budget matched to the blessed CGN h250c recipe (250k steps, train_frames=250,
# ADR-0039 scored horizon); input_frames = 6 satisfies the card (ADR-0035, h=0).
# DECLARED DEVIATIONS from h250c: no aux_transform/aux_tail_weight (the native
# families train the max-principal-strain channel in raw space, plain MSE) and
# family-native batch 2 / noise 0.003 (CGN: batch 4 / noise 0.01) — ledger.
# Not yet run.

[run]
benchmark = "notch_beam_2d_impact"
seed = 1                        # avoid seed 0 for training runs (CORRECTIONS 2026-07-10)

[model]
family = "mgn"
input_frames = 6                # notch card protocol (ADR-0035); h=0 — see header
dim = 2
hidden_dim = 128                # ADR-0043 §8 family reference
message_passing_steps = 15
nmlp_layers = 2
node_type_size = 4              # raw ids: 1 = beam, 2 = pin, 3 = supports (max id + 1)
world_edge_radius = 7.5         # working frame (mm) = CGN notch connectivity_radius
                                # (3x the 2.5 mm particle spacing, CORRECTIONS
                                # 2026-07-06). Measured 2026-08-12: initial pin-beam
                                # gap 2.5-2.7 mm across all 110 cases, so contact is
                                # world-edge-visible from frame 0.
noise_std = 0.003               # DP family-reference value (ADR-0043 §8); CGN taylor
                                # uses 0.02 — a taylor-scale noise sweep stays open
                                # (training ledger).
normalizer_warmup_steps = 1000

history_frames = 0          # reference Markovian feature builder (ADR-0049 off)
mesh_edge_max_stretch = 0.0   # stretch gate disabled — reference behaviour (ADR-0049)

[train]
batch_size = 2                  # ADR-0043 §8 family reference
lr_init = 1e-4
lr_decay = 0.1
# lr_decay_steps is derived from training_steps by config.py: round(steps * 40000/100000).
# Derived lr_decay_steps=100000 — same 0.4 ratio as the h250c schedule.
training_steps = 250_000        # h250c-matched budget (ADR-0048), not DP's 10M
val_every = 2000                # h250c cadence (8 val rollouts of 244 scored steps)
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0           # plain MSE (ADR-0043 §9 single L2, equal weight)
train_frames = 250              # ADR-0039 §4 recipe: train only the scored window
