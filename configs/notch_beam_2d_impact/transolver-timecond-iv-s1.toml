# notch_beam_2d_impact — Transolver TIME-CONDITIONED (native structural scheme) +
# impact-velocity conditioning, seed 1 (ADR-0054).
# The faithful thuml structural (Plasticity) template: history-free,
# non-autoregressive. The model maps (rest geometry + node types + scalar
# impact velocity + prescribed pin/support state at t + query time t) ->
# absolute state at t; every scored frame is queried independently (no rollout,
# no velocity window). frames_per_call=1 and velocity_history=false are
# REQUIRED (mutually exclusive with time-conditioning). noise_std=0 (inert:
# injected single-step noise needs autoregression). Budget matches the h250c /
# oneshot-iv recipe (250k, train_frames=250) for a scheme-only comparison over
# the ADR-0039 250 µs scored horizon. Not yet run.

[run]
benchmark = "notch_beam_2d_impact"
seed = 1

[model]
family = "transolver"
input_frames = 6                # notch card protocol (ADR-0035); see header
dim = 2
hidden_dim = 128                # ADR-0044 family reference
n_layers = 8
n_heads = 8
slice_num = 64
mlp_ratio = 1
dropout = 0.0
node_type_size = 4              # raw ids: 1 = beam, 2 = pin, 3 = supports (max id + 1)
noise_std = 0.0                  # inert under time-conditioning (no rollout; ADR-0054)
normalizer_warmup_steps = 1000
weight_decay = 1e-5             # AdamW, thuml reference (ADR-0044)
max_grad_norm = 0.1             # global-norm clip, thuml reference

history_frames = 0              # REQUIRED 0 for time-conditioning (ADR-0054/0053)
frames_per_call = 1             # REQUIRED 1 for time-conditioning (ADR-0054)
impact_velocity_feature = true   # ADR-0051 B: scalar impact-velocity conditioning
time_conditioned = true          # ADR-0054: faithful thuml native structural scheme
adaptive_temperature = false     # ADR-0057 (off = byte-identical)
slice_reparam = false            # ADR-0057 (off = byte-identical)
aux_input = false            # ADR-0060 state-feedback input (off = reference)
aux_input_noise_std = 0.0     # ADR-0061 stability knob (0 = off)
aux_input_pushforward = false # ADR-0061 stability knob (off = reference)
flow_map = false              # ADR-0062 anchored flow map (off = reference)
flow_map_anchor_time = true   # ADR-0062 anchor-time feature (inert when flow_map = false)
flow_map_max_dt = 0           # ADR-0062 training dt cap (0 = no cap)
flow_map_eval_intervals = []  # ADR-0062 re-anchoring m sweep (flow-map only)
flow_map_canonical_interval = 0  # ADR-0062 (0 = first listed interval)
flow_map_pushforward = false  # ADR-0063 anchor-chain knob (off = reference)
flow_map_anchor_noise_pos = 0.0  # ADR-0063 common-mode anchor noise, mm (0 = off)
flow_map_anchor_noise_vel = 0.0  # ADR-0063 differential anchor noise, mm/frame (0 = off)
flow_map_pushforward_generations = 1  # ADR-0063 amendment: chain-depth curriculum (1 = plain chain)
flow_map_structured_heads = false  # ADR-0064 knob 1 (return-map decoder)
flow_map_consistency_hinge = 0.0  # ADR-0064 knob 2 (soft comparator; exclusive with knob 1)

[train]
batch_size = 2                  # family reference (ADR-0044, matched to MGN)
lr_init = 1e-3                  # thuml reference start rate (ADR-0044)
lr_decay = 0.1                  # UNUSED by the transolver family (cosine anneal,
                                # ADR-0044); present because [train] is family-uniform.
training_steps = 250_000        # h250c-matched budget (ADR-0048), not DP's 10M
val_every = 2000                # h250c cadence
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0
train_frames = 250      # ADR-0039 §4 recipe: train only the scored window
