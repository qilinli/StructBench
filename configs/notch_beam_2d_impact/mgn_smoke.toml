# CPU smoke of the Notch-impact MGN train->checkpoint->eval path. NOT a baseline.
# Mirrors mgn.toml with a shrunk capacity cell and a relaxed world_edge_radius
# (15.0 vs the reference 7.5) so a tiny smoke slice still forms connected
# world edges. input_frames stays 6 — the notch card check (ADR-0035) applies
# to smokes too.

[run]
benchmark = "notch_beam_2d_impact"
seed = 0                        # torch RNG: init, noise, shuffle

[model]
family = "mgn"
input_frames = 6
dim = 2
hidden_dim = 16
message_passing_steps = 2
nmlp_layers = 2
node_type_size = 4
world_edge_radius = 15.0
noise_std = 0.003
normalizer_warmup_steps = 5

velocity_history = false      # reference Markovian feature builder (ADR-0049 off)
mesh_edge_max_stretch = 0.0   # stretch gate disabled — reference behaviour (ADR-0049)

[train]
batch_size = 2
lr_init = 1e-4
lr_decay = 0.1
training_steps = 50
val_every = 25
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0
train_frames = 0
